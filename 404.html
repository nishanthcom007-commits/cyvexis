<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 &bull; Page Not Found | Cyvexis Cybersecurity</title>
  <meta name="description" content="The requested security resource or drill could not be found." />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Fira+Code:wght@500;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --brand-accent: #957D58;
      --brand-accent-hover: #826A47;
      --bg-canvas: #FAF8F5;
      --bg-card: #FFFFFF;
      --border-subtle: #E8E3DC;
      --border-medium: #DCD6CB;
      --text-main: #1C1917;
      --text-body: #3E3A36;
      --text-muted: #78716C;
      --text-dim: #9C958D;
      --font-sans: 'Plus Jakarta Sans', system-ui, sans-serif;
      --font-mono: 'Fira Code', monospace;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at 50% 0%, #FFFFFF 0%, #FAF8F5 55%, #F4EFE6 100%) fixed;
      color: var(--text-body);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }

    .error-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-top: 3px solid var(--brand-accent);
      border-radius: 20px;
      padding: 52px 40px;
      max-width: 580px;
      width: 100%;
      box-shadow: 0 8px 30px rgba(44, 38, 30, 0.05);
    }

    .error-code {
      font-size: 5rem;
      font-weight: 800;
      font-family: var(--font-mono);
      color: var(--brand-accent);
      line-height: 1;
      margin-bottom: 16px;
      letter-spacing: -0.03em;
    }

    .error-title {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 14px;
      color: var(--text-main);
      letter-spacing: -0.01em;
    }

    .error-desc {
      color: var(--text-body);
      font-size: 0.98rem;
      line-height: 1.65;
      margin-bottom: 30px;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--text-main);
      color: #FFFFFF;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.92rem;
      padding: 13px 28px;
      border-radius: 9999px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(28, 25, 23, 0.12);
    }

    .btn-home:hover {
      background: var(--brand-accent);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(149, 125, 88, 0.25);
    }

    .security-note {
      margin-top: 26px;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--text-dim);
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>

  <div class="error-card">
    <div class="error-code">404</div>
    <h1 class="error-title">Resource Not Found</h1>
    <p class="error-desc">
      The requested security path or drill endpoint does not exist. Administrative and non-public endpoints are restricted under Cyvexis access policies.
    </p>
    <a href="./index.html" class="btn-home">← Return to Training Portal</a>
    <div class="security-note">
      STATUS: RESTRICTED // DEBUG_MODE: OFF
    </div>
  </div>

</body>
</html>
